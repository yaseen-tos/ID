<script>

    // ============================================================
    // DOM ELEMENTS
    // ============================================================

    const canvas = document.getElementById('c');
    const context = canvas.getContext('2d', { alpha: false });

    const userInterface = document.getElementById('ui');
    const adjustmentImage = document.getElementById('adj-img');
    const zoomRange = document.getElementById('z-range');

    const fileUpload = document.getElementById('f-up');
    const launchButton = document.getElementById('go');
    const shareButton = document.getElementById('share');

    const hebrewNameInput = document.getElementById('in-h');
    const englishNameInput = document.getElementById('in-e');
    const idNumberInput = document.getElementById('in-i');
    const dateInput = document.getElementById('in-d');
    const timeInput = document.getElementById('in-t');
    const englishYearInput = document.getElementById('in-y');
    const hebrewYearInput = document.getElementById('in-yh');


    // ============================================================
    // IMAGE / PHOTO STATE
    // ============================================================

    let templateImage = new Image();
    let photoImage = null;

    let photoX = 0;
    let photoY = 0;
    let photoScale = 1;


    // ============================================================
    // PHOTO POSITION BOXES
    // ============================================================

    // Measured from img.png.
    // Used if automatic scanning fails.
    const FALLBACK_BOXES = [
        { x: 68,  y: 552,  w: 404, h: 413 }, // boxes[0] = photo
        { x: 632, y: 600,  w: 240, h: 103 }, // boxes[1] = name
        { x: 652, y: 972,  w: 210, h: 50  }, // boxes[2] = ID number
        { x: 96,  y: 1008, w: 351, h: 122 }, // boxes[3] = year
        { x: 372, y: 1576, w: 207, h: 37  }, // boxes[4] = ID under barcode
        { x: 364, y: 1696, w: 224, h: 50  }, // boxes[5] = time
        { x: 316, y: 1764, w: 316, h: 55  }  // boxes[6] = date
    ];

    let templateBoxes = [];


    // ============================================================
    // SCREEN ORIENTATION
    // ============================================================

    if (screen.orientation && screen.orientation.lock) {
        screen.orientation.lock('portrait').catch(() => {});
    }


    // ============================================================
    // LOAD TEMPLATE IMAGE
    // ============================================================

    templateImage.src = 'img.png';

    templateImage.onload = () => {
        try {
            scanTemplate();

            if (templateBoxes.length < 7) {
                throw new Error(
                    'Only ' + templateBoxes.length + ' boxes found'
                );
            }

        } catch (error) {
            console.warn(
                'Auto-scan failed, using built-in box positions:',
                error
            );

            templateBoxes = FALLBACK_BOXES.map(box => ({ ...box }));
        }
    };

    templateImage.onerror = () => {
        alert(
            'img.png failed to load! Keep img.png in the SAME folder as this HTML file.'
        );
    };


    // ============================================================
    // FULLSCREEN
    // ============================================================

    function enterFullscreen() {
        // Works on Android/Desktop.
        // Safely ignored on iPhone where fullscreen may not be supported.

        if (document.documentElement.requestFullscreen) {
            document.documentElement.requestFullscreen().catch(error => {
                console.log(
                    `Fullscreen request was ignored or failed: ${error.message}`
                );
            });
        }
    }


    // ============================================================
    // LOAD SAVED / URL DATA
    // ============================================================

    window.onload = () => {

        const urlParameters = new URLSearchParams(
            window.location.search
        );

        const savedData = JSON.parse(
            localStorage.getItem('id_final_v14') || '{}'
        );


        // Fill form fields

        hebrewNameInput.value =
            urlParameters.get('h') ||
            savedData.h ||
            'ישראל ישראלי';

        englishNameInput.value =
            urlParameters.get('e') ||
            savedData.e ||
            'ISRAEL ISRAELI';

        idNumberInput.value =
            urlParameters.get('i') ||
            savedData.i ||
            '123456789';

        dateInput.value =
            urlParameters.get('d') ||
            savedData.d ||
            '';

        timeInput.value =
            urlParameters.get('t') ||
            savedData.t ||
            '';

        englishYearInput.value =
            urlParameters.get('y') ||
            savedData.y ||
            '';

        hebrewYearInput.value =
            urlParameters.get('yh') ||
            savedData.yh ||
            '';


        // Load photo

        const urlPhotoData = urlParameters.get('img');
        const photoSource = urlPhotoData || savedData.img;

        if (photoSource) {

            photoImage = new Image();
            photoImage.crossOrigin = "anonymous";

            photoImage.onload = () => {

                adjustmentImage.src = photoImage.src;
                adjustmentImage.style.display = 'block';

                if (urlParameters.has('h')) {

                    userInterface.classList.add('hidden');

                    canvas.style.zIndex = '2000';
                    canvas.style.pointerEvents = 'auto';

                    render();

                    enterFullscreen();
                }
            };


            photoImage.onerror = () => {

                console.error(
                    'Failed to load image from URL'
                );

                if (savedData.img) {
                    photoImage.src = savedData.img;
                }
            };


            photoImage.src = photoSource;


            photoX =
                parseFloat(urlParameters.get('px')) ||
                savedData.px ||
                0;

            photoY =
                parseFloat(urlParameters.get('py')) ||
                savedData.py ||
                0;

            photoScale =
                parseFloat(urlParameters.get('ps')) ||
                savedData.ps ||
                1;


            adjustmentImage.style.transform =
                `translate(${photoX}px, ${photoY}px) scale(${photoScale})`;

            zoomRange.value = photoScale;
        }
    };


    // ============================================================
    // PHOTO UPLOAD
    // ============================================================

    fileUpload.onchange = event => {

        const fileReader = new FileReader();

        fileReader.onload = readerEvent => {

            const temporaryImage = new Image();

            temporaryImage.onload = () => {

                const resizedCanvas =
                    document.createElement('canvas');

                const maximumSize = 1000;

                let imageWidth = temporaryImage.width;
                let imageHeight = temporaryImage.height;


                if (imageWidth > imageHeight) {

                    imageHeight =
                        (maximumSize / imageWidth) *
                        imageHeight;

                    imageWidth = maximumSize;

                } else {

                    imageWidth =
                        (maximumSize / imageHeight) *
                        imageWidth;

                    imageHeight = maximumSize;
                }


                resizedCanvas.width = imageWidth;
                resizedCanvas.height = imageHeight;


                resizedCanvas
                    .getContext('2d')
                    .drawImage(
                        temporaryImage,
                        0,
                        0,
                        imageWidth,
                        imageHeight
                    );


                photoImage = new Image();

                photoImage.src =
                    resizedCanvas.toDataURL(
                        'image/webp',
                        0.92
                    );

                adjustmentImage.src = photoImage.src;
            };


            temporaryImage.src = readerEvent.target.result;
        };


        fileReader.readAsDataURL(
            event.target.files[0]
        );
    };


    // ============================================================
    // PHOTO DRAGGING
    // ============================================================

    let isDraggingPhoto = false;
    let dragStartOffsetX;
    let dragStartOffsetY;


    function handleDragStart(event) {

        event.preventDefault();

        isDraggingPhoto = true;


        const pointerX =
            event.touches
                ? event.touches[0].clientX
                : event.clientX;

        const pointerY =
            event.touches
                ? event.touches[0].clientY
                : event.clientY;


        dragStartOffsetX =
            pointerX - photoX;

        dragStartOffsetY =
            pointerY - photoY;


        window.addEventListener(
            'mousemove',
            handleDragMove
        );

        window.addEventListener(
            'touchmove',
            handleDragMove,
            { passive: false }
        );

        window.addEventListener(
            'mouseup',
            handleDragEnd
        );

        window.addEventListener(
            'touchend',
            handleDragEnd
        );
    }


    function handleDragMove(event) {

        if (!isDraggingPhoto) {
            return;
        }

        event.preventDefault();


        const pointerX =
            event.touches
                ? event.touches[0].clientX
                : event.clientX;

        const pointerY =
            event.touches
                ? event.touches[0].clientY
                : event.clientY;


        photoX =
            pointerX - dragStartOffsetX;

        photoY =
            pointerY - dragStartOffsetY;


        updatePhotoTransform();
    }


    function handleDragEnd() {

        isDraggingPhoto = false;


        window.removeEventListener(
            'mousemove',
            handleDragMove
        );

        window.removeEventListener(
            'touchmove',
            handleDragMove,
            { passive: false }
        );

        window.removeEventListener(
            'mouseup',
            handleDragEnd
        );

        window.removeEventListener(
            'touchend',
            handleDragEnd
        );
    }


    adjustmentImage.addEventListener(
        'mousedown',
        handleDragStart
    );

    adjustmentImage.addEventListener(
        'touchstart',
        handleDragStart
    );


    // ============================================================
    // PHOTO ZOOM
    // ============================================================

    zoomRange.oninput = event => {

        photoScale = event.target.value;

        updatePhotoTransform();
    };


    // Desktop mouse-wheel zoom

    document
        .querySelector('.pre-win')
        .addEventListener(
            'wheel',
            event => {

                event.preventDefault();

                photoScale = Math.min(
                    4,
                    Math.max(
                        0.1,
                        photoScale *
                        (event.deltaY < 0 ? 1.05 : 0.95)
                    )
                );

                zoomRange.value = photoScale;

                updatePhotoTransform();
            },
            { passive: false }
        );


    // Mobile pinch-to-zoom

    let pinchDistance = 0;


    document
        .querySelector('.pre-win')
        .addEventListener(
            'touchmove',
            event => {

                if (event.touches.length === 2) {

                    event.preventDefault();


                    const currentPinchDistance =
                        Math.hypot(
                            event.touches[0].clientX -
                            event.touches[1].clientX,

                            event.touches[0].clientY -
                            event.touches[1].clientY
                        );


                    if (pinchDistance) {

                        photoScale = Math.min(
                            4,
                            Math.max(
                                0.1,
                                photoScale *
                                (
                                    currentPinchDistance /
                                    pinchDistance
                                )
                            )
                        );

                        zoomRange.value = photoScale;

                        updatePhotoTransform();
                    }


                    pinchDistance =
                        currentPinchDistance;
                }
            },
            { passive: false }
        );


    document
        .querySelector('.pre-win')
        .addEventListener(
            'touchend',
            () => {
                pinchDistance = 0;
            }
        );


    function updatePhotoTransform() {

        adjustmentImage.style.transform =
            `translate(${photoX}px, ${photoY}px) scale(${photoScale})`;
    }


    // ============================================================
    // LAUNCH CARD
    // ============================================================

    launchButton.onclick = () => {

        localStorage.setItem(
            'id_final_v14',
            JSON.stringify({

                h: hebrewNameInput.value,
                e: englishNameInput.value,
                i: idNumberInput.value,

                d: dateInput.value,
                t: timeInput.value,

                y: englishYearInput.value,
                yh: hebrewYearInput.value,

                px: photoX,
                py: photoY,
                ps: photoScale,

                img: photoImage
                    ? photoImage.src
                    : null
            })
        );


        userInterface.classList.add('hidden');

        canvas.style.zIndex = '2000';
        canvas.style.pointerEvents = 'auto';


        enterFullscreen();

        render();
    };


    // If fullscreen exits, clicking the card attempts to restore it.

    canvas.onclick = () => {

        if (
            userInterface.classList.contains('hidden') &&
            !document.fullscreenElement
        ) {
            enterFullscreen();
        }
    };


    // ============================================================
    // RENDER LOOP
    // ============================================================

    function render() {

        drawCard();

        setTimeout(
            () => requestAnimationFrame(render),
            1000
        );
    }


    // ============================================================
    // ACADEMIC YEAR
    // ============================================================

    function getAcademicYear() {

        const currentDate = new Date();

        return currentDate.getMonth() >= 8
            ? `${currentDate.getFullYear()}-${currentDate.getFullYear() + 1}`
            : `${currentDate.getFullYear() - 1}-${currentDate.getFullYear()}`;
    }


    // ============================================================
    // HEBREW YEAR
    // ============================================================

    function convertToHebrewYear(gregorianYear) {

        const ones = [
            '',
            'א',
            'ב',
            'ג',
            'ד',
            'ה',
            'ו',
            'ז',
            'ח',
            'ט'
        ];

        const tens = [
            '',
            'י',
            'כ',
            'ל',
            'מ',
            'נ',
            'ס',
            'ע',
            'פ',
            'צ'
        ];

        const hundreds = [
            '',
            'ק',
            'ר',
            'ש',
            'ת',
            'תק',
            'תר',
            'תש',
            'תת',
            'תתק'
        ];


        let remainingYear = gregorianYear;

        const thousands =
            Math.floor(remainingYear / 1000);

        remainingYear %= 1000;


        const hundredDigit =
            Math.floor(remainingYear / 100);

        remainingYear %= 100;


        const tenDigit =
            Math.floor(remainingYear / 10);

        const oneDigit =
            remainingYear % 10;


        let hebrewYear =
            (
                thousands
                    ? ones[thousands] + '׳'
                    : ''
            ) +
            hundreds[hundredDigit] +
            tens[tenDigit] +
            ones[oneDigit];


        if (hebrewYear.length > 1) {

            hebrewYear =
                hebrewYear.slice(0, -1) +
                '״' +
                hebrewYear.slice(-1);
        }


        return hebrewYear;
    }


    // ============================================================
    // TEXT FITTING
    // ============================================================

    function fitText(
        text,
        x,
        y,
        maximumWidth,
        maximumHeight,
        isBold,
        textAlignment,
        textColor,
        fontFamily = 'sans-serif'
    ) {

        let fontSize = maximumHeight;


        context.textAlign = textAlignment;
        context.fillStyle = textColor;

        context.font =
            `${isBold ? 'bold ' : ''}${fontSize}px ${fontFamily}`;


        while (
            context.measureText(text).width > maximumWidth &&
            fontSize > 8
        ) {

            fontSize--;

            context.font =
                `${isBold ? 'bold ' : ''}${fontSize}px ${fontFamily}`;
        }


        context.fillText(
            text,
            x,
            y
        );
    }


    // ============================================================
    // DRAW CARD
    // ============================================================

    function drawCard() {

        const canvasWidth = templateImage.width;
        const canvasHeight = templateImage.height;


        if (canvas.width !== canvasWidth) {

            canvas.width = canvasWidth;
            canvas.height = canvasHeight;
        }


        context.fillStyle = '#fff';

        context.fillRect(
            0,
            0,
            canvasWidth,
            canvasHeight
        );


        if (templateBoxes.length < 7) {
            return;
        }


        const photoBox = templateBoxes[0];
        const nameBox = templateBoxes[1];
        const idNumberBox = templateBoxes[2];
        const academicYearBox = templateBoxes[3];
        const barcodeIdBox = templateBoxes[4];
        const timeBox = templateBoxes[5];
        const dateBox = templateBoxes[6];


        const idNumber = idNumberInput.value;


        // ========================================================
        // PHOTO AREA
        // ========================================================

        if (photoBox) {

            context.fillStyle = '#4b374e';

            context.fillRect(
                photoBox.x,
                photoBox.y,
                photoBox.w,
                photoBox.h
            );
        }


        // ========================================================
        // USER PHOTO
        // ========================================================

        if (photoImage && photoBox) {

            const photoScaleRatio =
                photoBox.w / 160;

            const bleedSize = 20;


            context.drawImage(
                photoImage,

                photoBox.x +
                    (photoX * photoScaleRatio) -
                    bleedSize,

                photoBox.y +
                    (photoY * photoScaleRatio) -
                    bleedSize,

                (photoImage.width *
                    photoScale *
                    photoScaleRatio) +
                    (bleedSize * 2),

                (photoImage.height *
                    photoScale *
                    photoScaleRatio) +
                    (bleedSize * 2)
            );

        } else if (photoBox) {

            // Default silhouette avatar

            context.save();

            context.beginPath();

            context.rect(
                photoBox.x,
                photoBox.y,
                photoBox.w,
                photoBox.h
            );

            context.clip();


            const photoCenterX =
                photoBox.x + photoBox.w / 2;

            const photoCenterY =
                photoBox.y + photoBox.h / 2;

            const silhouetteRadius =
                photoBox.w;


            context.fillStyle = '#6b5870';


            context.beginPath();

            context.arc(
                photoCenterX,
                photoCenterY -
                    silhouetteRadius * 0.22,

                silhouetteRadius * 0.24,

                0,
                Math.PI * 2
            );

            context.fill();


            context.beginPath();

            context.arc(
                photoCenterX,
                photoCenterY +
                    silhouetteRadius * 0.85,

                silhouetteRadius * 0.48,

                Math.PI,
                0
            );

            context.fill();


            context.restore();
        }


        // ========================================================
        // TEXT BACKGROUNDS
        // ========================================================

        if (nameBox) {

            context.fillStyle = '#4b374e';

            context.fillRect(
                nameBox.x - 4,
                nameBox.y - 4,
                nameBox.w + 8,
                nameBox.h + 8
            );
        }


        if (idNumberBox) {

            context.fillStyle = '#4b374e';

            context.fillRect(
                idNumberBox.x - 4,
                idNumberBox.y - 4,
                idNumberBox.w + 8,
                idNumberBox.h + 8
            );
        }


        if (barcodeIdBox) {

            context.fillStyle = '#ffffff';

            context.fillRect(
                barcodeIdBox.x - 4,
                barcodeIdBox.y - 4,
                barcodeIdBox.w + 8,
                barcodeIdBox.h + 8
            );
        }


        if (timeBox) {

            context.fillStyle = '#ffffff';

            context.fillRect(
                timeBox.x - 4,
                timeBox.y - 4,
                timeBox.w + 8,
                timeBox.h + 8
            );
        }


        if (dateBox) {

            context.fillStyle = '#ffffff';

            context.fillRect(
                dateBox.x - 4,
                dateBox.y - 4,
                dateBox.w + 8,
                dateBox.h + 8
            );
        }


        // ========================================================
        // DRAW ORIGINAL TEMPLATE
        // ========================================================

        context.drawImage(
            templateImage,
            0,
            0,
            canvasWidth,
            canvasHeight
        );


        // ========================================================
        // NAME
        // ========================================================

        if (nameBox) {

            // Hebrew name

            fitText(
                hebrewNameInput.value,

                nameBox.x +
                    nameBox.w * 0.94,

                nameBox.y +
                    nameBox.h * 0.06,

                nameBox.w * 0.9,

                nameBox.h * 0.38,

                true,

                'right',

                '#fff'
            );


            // English name

            fitText(
                englishNameInput.value,

                nameBox.x +
                    nameBox.w * 0.94,

                nameBox.y +
                    nameBox.h * 0.58,

                nameBox.w * 0.9,

                nameBox.h * 0.38,

                true,

                'right',

                '#fff'
            );
        }


        // ========================================================
        // ID NUMBER
        // ========================================================

        if (idNumberBox) {

            fitText(
                idNumber,

                idNumberBox.x +
                    idNumberBox.w * 0.98,

                idNumberBox.y +
                    idNumberBox.h * 0.50,

                idNumberBox.w * 0.98,

                idNumberBox.h * 0.85,

                true,

                'right',

                '#fff'
            );
        }


        // ========================================================
        // ACADEMIC YEAR
        // ========================================================

        if (academicYearBox) {

            context.fillStyle = '#4b374e';

            context.fillRect(
                academicYearBox.x - 4,
                academicYearBox.y - 4,
                academicYearBox.w + 8,
                academicYearBox.h + 8
            );


            const hebrewAcademicYear =
                hebrewYearInput.value.trim() ||
                convertToHebrewYear(
                    new Date().getFullYear() + 3761
                );


            const englishAcademicYear =
                englishYearInput.value.trim() ||
                getAcademicYear();


            context.textBaseline = 'middle';


            fitText(
                hebrewAcademicYear,

                academicYearBox.x +
                    academicYearBox.w / 2,

                academicYearBox.y +
                    academicYearBox.h * 0.32,

                academicYearBox.w * 0.9,

                academicYearBox.h * 0.36,

                true,

                'center',

                '#fff'
            );


            fitText(
                englishAcademicYear,

                academicYearBox.x +
                    academicYearBox.w / 2,

                academicYearBox.y +
                    academicYearBox.h * 0.74,

                academicYearBox.w * 0.9,

                academicYearBox.h * 0.36,

                true,

                'center',

                '#fff'
            );
        }


        // ========================================================
        // ID UNDER BARCODE
        // ========================================================

        if (barcodeIdBox) {

            fitText(
                idNumber,

                barcodeIdBox.x +
                    barcodeIdBox.w / 2,

                barcodeIdBox.y +
                    barcodeIdBox.h * 0.55,

                barcodeIdBox.w * 0.99,

                barcodeIdBox.h,

                false,

                'center',

                '#3e3e3e'
            );
        }


        // ========================================================
        // TIME
        // ========================================================

        if (timeBox) {

            const manuallyEnteredTime =
                timeInput.value.trim();

            const currentTime =
                manuallyEnteredTime ||
                new Date().toLocaleTimeString(
                    'en-GB',
                    { hour12: false }
                );


            context.textBaseline = 'middle';


            fitText(
                currentTime,

                timeBox.x +
                    timeBox.w / 2,

                timeBox.y +
                    timeBox.h / 2,

                timeBox.w * 0.95,

                timeBox.h * 0.95,

                false,

                'center',

                '#4f374f',

                'system-ui, sans-serif'
            );
        }


        // ========================================================
        // DATE
        // ========================================================

        if (dateBox) {

            const manuallyEnteredDate =
                dateInput.value.trim();

            let displayedDate;


            if (manuallyEnteredDate) {

                displayedDate =
                    manuallyEnteredDate;

            } else {

                const currentDate = new Date();

                const day =
                    String(
                        currentDate.getDate()
                    ).padStart(2, '0');

                const month =
                    String(
                        currentDate.getMonth() + 1
                    ).padStart(2, '0');

                const year =
                    currentDate.getFullYear();


                displayedDate =
                    `${day}/${month}/${year}`;
            }


            context.textBaseline = 'middle';


            fitText(
                displayedDate,

                dateBox.x +
                    dateBox.w / 2,

                dateBox.y +
                    dateBox.h / 2,

                dateBox.w * 0.98,

                dateBox.h * 0.98,

                true,

                'center',

                '#4f374f',

                'system-ui, sans-serif'
            );
        }
    }


    // ============================================================
    // TEMPLATE SCANNER
    // ============================================================

    function scanTemplate() {

        const scanCanvas =
            document.createElement('canvas');

        scanCanvas.width =
            templateImage.width;

        scanCanvas.height =
            templateImage.height;


        const scanContext =
            scanCanvas.getContext('2d');


        scanContext.drawImage(
            templateImage,
            0,
            0
        );


        const pixelData =
            scanContext.getImageData(
                0,
                0,
                scanCanvas.width,
                scanCanvas.height
            ).data;


        const detectedBoxes = [];


        const visitedPixels =
            new Uint8Array(
                scanCanvas.width *
                scanCanvas.height
            );


        for (
            let y = 0;
            y < scanCanvas.height;
            y += 4
        ) {

            for (
                let x = 0;
                x < scanCanvas.width;
                x += 4
            ) {

                const pixelIndex =
                    (y * scanCanvas.width + x) * 4;


                if (
                    pixelData[pixelIndex + 3] < 150 &&
                    !visitedPixels[
                        y * scanCanvas.width + x
                    ]
                ) {

                    let rightEdge = x;
                    let bottomEdge = y;


                    while (
                        rightEdge < scanCanvas.width &&
                        pixelData[
                            (y * scanCanvas.width + rightEdge) * 4 + 3
                        ] < 150
                    ) {
                        rightEdge++;
                    }


                    while (
                        bottomEdge < scanCanvas.height &&
                        pixelData[
                            (bottomEdge * scanCanvas.width + x) * 4 + 3
                        ] < 150
                    ) {
                        bottomEdge++;
                    }


                    const detectedWidth =
                        rightEdge - x;

                    const detectedHeight =
                        bottomEdge - y;


                    if (detectedWidth > 15) {

                        detectedBoxes.push({
                            x: x,
                            y: y,
                            w: detectedWidth,
                            h: detectedHeight
                        });


                        for (
                            let visitedY = y;
                            visitedY < bottomEdge;
                            visitedY += 4
                        ) {

                            for (
                                let visitedX = x;
                                visitedX < rightEdge;
                                visitedX += 4
                            ) {

                                visitedPixels[
                                    visitedY *
                                    scanCanvas.width +
                                    visitedX
                                ] = 1;
                            }
                        }
                    }
                }
            }
        }


        detectedBoxes.sort(
            (firstBox, secondBox) =>
                firstBox.x - secondBox.x
        );


        templateBoxes = [
            detectedBoxes.shift(),
            ...detectedBoxes.sort(
                (firstBox, secondBox) =>
                    firstBox.y - secondBox.y
            )
        ];
    }


    // ============================================================
    // SHARE URL
    // ============================================================

    shareButton.onclick = () => {

        const shareCanvas =
            document.createElement('canvas');

        shareCanvas.width = 100;
        shareCanvas.height = 100;


        if (photoImage) {

            shareCanvas
                .getContext('2d')
                .drawImage(
                    photoImage,
                    0,
                    0,
                    100,
                    100
                );
        }


        const compressedPhoto =
            shareCanvas.toDataURL(
                'image/jpeg',
                0.1
            );


        const shareUrl =
            new URL(
                window.location.href
            );


        shareUrl.searchParams.set(
            'h',
            hebrewNameInput.value
        );

        shareUrl.searchParams.set(
            'e',
            englishNameInput.value
        );

        shareUrl.searchParams.set(
            'i',
            idNumberInput.value
        );

        shareUrl.searchParams.set(
            'd',
            dateInput.value
        );

        shareUrl.searchParams.set(
            't',
            timeInput.value
        );

        shareUrl.searchParams.set(
            'y',
            englishYearInput.value
        );

        shareUrl.searchParams.set(
            'yh',
            hebrewYearInput.value
        );

        shareUrl.searchParams.set(
            'px',
            photoX
        );

        shareUrl.searchParams.set(
            'py',
            photoY
        );

        shareUrl.searchParams.set(
            'ps',
            photoScale
        );

        shareUrl.searchParams.set(
            'img',
            compressedPhoto
        );


        const finalUrl =
            shareUrl.toString();


        if (finalUrl.length > 2000) {

            alert(
                "Warning: URL is very long. If it doesn't work, try a different photo."
            );
        }


        if (navigator.clipboard) {

            navigator.clipboard
                .writeText(finalUrl)
                .then(
                    () => alert("URL Copied!")
                );

        } else {

            prompt(
                "Copy this:",
                finalUrl
            );
        }
    };

</script>
